server {
    listen 80;
    server_name localhost;

    # 1. Phục vụ các tệp tĩnh Angular SPA (Single Page Application)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Điều hướng tất cả route về index.html tránh lỗi 404 khi F5
    }

    # 2. Reverse Proxy: Chuyển tiếp các request gọi /api/ sang Backend Container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
