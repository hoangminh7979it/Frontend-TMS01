<!-- MODAL 1: CREATE / EDIT CUSTOMER -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fa-solid fa-building-circle-check"></i> {{ isEditMode ? 'Chỉnh Sửa Hồ Sơ Khách Hàng' : 'Khai Báo Khách Hàng Mới' }}</h3>
      <button class="modal-close" (click)="onClose()">&times;</button>
    </div>
    
    <form [formGroup]="customerForm" (ngSubmit)="onSave()">
      <div class="modal-body">
        
        <!-- Modal Error Alert -->
        <div *ngIf="errorMessage" class="toast-alert toast-error modal-alert">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ errorMessage }}
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Mã Khách Hàng *</label>
            <input 
              type="text" 
              formControlName="customerCode" 
              placeholder="Ví dụ: KH-001..." 
              [ngClass]="{'input-error': customerForm.controls['customerCode'].invalid && customerForm.controls['customerCode'].touched}"
            />
          </div>
          
          <div class="form-group">
            <label>Loại Khách Hàng *</label>
            <select formControlName="customerType">
              <option value="CORPORATE">Doanh Nghiệp / Công Ty (MST)</option>
              <option value="INDIVIDUAL">Cá Nhân / Khách Lẻ</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Tên Công Ty / Doanh Nghiệp</label>
          <input type="text" formControlName="companyName" placeholder="Công ty TNHH Vận Tải Logistics..." />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Mã Số Thuế (MST)</label>
            <input type="text" formControlName="taxCode" placeholder="Mã số thuế doanh nghiệp..." />
          </div>

          <div class="form-group">
            <label>Số Điện Thoại Liên Hệ</label>
            <input type="text" formControlName="phone" placeholder="0912..." />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Họ & Tên Đệm Đại Diện *</label>
            <input 
              type="text" 
              formControlName="firstname" 
              placeholder="Nguyễn Văn..." 
              [ngClass]="{'input-error': customerForm.controls['firstname'].invalid && customerForm.controls['firstname'].touched}"
            />
          </div>
          
          <div class="form-group">
            <label>Tên Đại Diện</label>
            <input type="text" formControlName="lastname" placeholder="Minh..." />
          </div>
        </div>

        <div class="form-group">
          <label>Email Liên Hệ / Hóa Đơn</label>
          <input type="email" formControlName="email" placeholder="contact@company.com" />
        </div>

        <div class="form-group">
          <label>Địa Chỉ Trụ Sở / Giao Nhận Hàng</label>
          <textarea formControlName="address" rows="2" placeholder="Địa chỉ giao nhận hàng hóa chi tiết..."></textarea>
        </div>

        <div class="form-group">
          <label>Ghi Chú Hợp Đồng / Ưu Đãi</label>
          <textarea formControlName="notes" rows="2" placeholder="Ghi chú chiết khấu, điều khoản hợp đồng..."></textarea>
        </div>

      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Hủy</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <i class="fa-solid fa-floppy-disk"></i> Lưu Hồ Sơ Khách Hàng
        </button>
      </div>
    </form>
  </div>
</div>
